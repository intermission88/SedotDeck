<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" role="img"><title>A new release on GitHub, GitLab, Codeberg, Gitea or Forgejo goes through SedotDeck, which picks the Linux file and backs up your saves, into your Steam library: same shortcut, new version.</title><rect x="0" y="0" width="256" height="160" rx="14" fill="#1a1d23"/><text x="128.0" y="62.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#e6e8eb" text-anchor="middle">A new release</text><text x="128.0" y="88.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#aab2bd" text-anchor="middle">on GitHub, GitLab, Codeberg,</text><text x="128.0" y="108.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#aab2bd" text-anchor="middle">Gitea or Forgejo</text><rect x="312" y="0" width="256" height="160" rx="14" fill="#1a1d23"/><g transform="translate(414.0 6.5) scale(0.203125)"><path fill="#e6e8eb" fill-rule="evenodd" d="M64 112H192A40 40 0 0 1 232 152V168A40 40 0 0 1 192 208H64A40 40 0 0 1 24 168V152A40 40 0 0 1 64 112ZM89 130H167A5 5 0 0 1 172 135V185A5 5 0 0 1 167 190H89A5 5 0 0 1 84 185V135A5 5 0 0 1 89 130ZM66 150A11 11 0 1 0 44 150A11 11 0 1 0 66 150ZM212 150A11 11 0 1 0 190 150A11 11 0 1 0 212 150Z"/><path fill="#1a9fff" d="M151 114V86A5 5 0 0 1 152.46 82.46L186.41 48.52A11 11 0 0 0 170.85 32.97L136.91 66.91A27 27 0 0 0 129 86V114Z"/></g><text x="440.0" y="95.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#e6e8eb" text-anchor="middle">SedotDeck</text><text x="440.0" y="121.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#aab2bd" text-anchor="middle">picks the Linux file and</text><text x="440.0" y="141.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#aab2bd" text-anchor="middle">backs up your saves</text><rect x="624" y="0" width="256" height="160" rx="14" fill="#1a1d23"/><text x="752.0" y="62.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#e6e8eb" text-anchor="middle">Your Steam library</text><text x="752.0" y="88.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#aab2bd" text-anchor="middle">same shortcut,</text><text x="752.0" y="108.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#aab2bd" text-anchor="middle">new version</text><path fill="none" stroke="#1a9fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M268 80.0L300 80.0M291 71.0L300 80.0L291 89.0"/><path fill="none" stroke="#1a9fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M580 80.0L612 80.0M603 71.0L612 80.0L603 89.0"/></svg>
