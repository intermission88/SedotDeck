<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 554" width="320" height="554" role="img"><title>A new release on GitHub, GitLab, Codeberg, Gitea or Forgejo goes through SedotDeck, which picks the Linux file and backs up your saves, into your Steam library: same shortcut, new version.</title><rect x="0" y="0" width="320" height="150" rx="14" fill="#eef1f4"/><text x="160.0" y="57.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#0f1115" text-anchor="middle">A new release</text><text x="160.0" y="83.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#4a5260" text-anchor="middle">on GitHub, GitLab, Codeberg,</text><text x="160.0" y="103.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#4a5260" text-anchor="middle">Gitea or Forgejo</text><rect x="0" y="202" width="320" height="150" rx="14" fill="#eef1f4"/><g transform="translate(134.0 203.5) scale(0.203125)"><path fill="#0f1115" fill-rule="evenodd" d="M64 112H192A40 40 0 0 1 232 152V168A40 40 0 0 1 192 208H64A40 40 0 0 1 24 168V152A40 40 0 0 1 64 112ZM89 130H167A5 5 0 0 1 172 135V185A5 5 0 0 1 167 190H89A5 5 0 0 1 84 185V135A5 5 0 0 1 89 130ZM66 150A11 11 0 1 0 44 150A11 11 0 1 0 66 150ZM212 150A11 11 0 1 0 190 150A11 11 0 1 0 212 150Z"/><path fill="#1475c4" d="M151 114V86A5 5 0 0 1 152.46 82.46L186.41 48.52A11 11 0 0 0 170.85 32.97L136.91 66.91A27 27 0 0 0 129 86V114Z"/></g><text x="160.0" y="292.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#0f1115" text-anchor="middle">SedotDeck</text><text x="160.0" y="318.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#4a5260" text-anchor="middle">picks the Linux file and</text><text x="160.0" y="338.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#4a5260" text-anchor="middle">backs up your saves</text><rect x="0" y="404" width="320" height="150" rx="14" fill="#eef1f4"/><text x="160.0" y="461.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="19" font-weight="600" fill="#0f1115" text-anchor="middle">Your Steam library</text><text x="160.0" y="487.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#4a5260" text-anchor="middle">same shortcut,</text><text x="160.0" y="507.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif" font-size="15" font-weight="400" fill="#4a5260" text-anchor="middle">new version</text><path fill="none" stroke="#1475c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M160.0 162L160.0 190M151.0 181L160.0 190L169.0 181"/><path fill="none" stroke="#1475c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M160.0 364L160.0 392M151.0 383L160.0 392L169.0 383"/></svg>
