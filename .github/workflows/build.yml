name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: decky-plugin/package-lock.json

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin zip

      - name: Tests
        run: python3 -I tests/test_deckport.py deckport.py

      - name: Build AppImage
        run: appimage/build.sh dist

      - name: Smoke test AppImage
        run: |
          chmod +x dist/DeckPort-*-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/DeckPort-*-x86_64.AppImage --version

      - name: Typecheck Decky plugin
        working-directory: decky-plugin
        run: npm ci --no-audit --no-fund && npm run typecheck

      - name: Build Decky plugin
        run: decky-plugin/package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: deckport-builds
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DeckPort $GITHUB_REF_NAME" --generate-notes
