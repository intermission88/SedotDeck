name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decky:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: decky-plugin/package-lock.json

      - name: Tests
        run: python3 -I tests/test_deckport.py deckport.py

      - name: Typecheck Decky plugin
        working-directory: decky-plugin
        run: npm ci --no-audit --no-fund && npm run typecheck

      - name: Build Decky plugin
        run: |
          sudo apt-get install -y zip
          decky-plugin/package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: decky
          path: dist/*

  appimage:
    # Older glibc than SteamOS, so the AppImage runs there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build AppImage
        working-directory: desktop
        run: npm ci --no-audit --no-fund && npm run build

      - name: Collect AppImage
        run: |
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' deckport.py)"
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage "dist/DeckPort-$VERSION-x86_64.AppImage"
          chmod +x dist/*.AppImage
          ls -la dist

      - name: Smoke test AppImage (CLI mode)
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/DeckPort-*-x86_64.AppImage --version

      - name: Smoke test AppImage (window starts its backend)
        run: |
          sudo apt-get install -y xvfb
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$(mktemp -d)"
          xvfb-run -a dist/DeckPort-*-x86_64.AppImage > app.log 2>&1 &
          for i in $(seq 40); do
            ADDR="$(ss -ltnp | grep '"python3"' | grep -o '127\.0\.0\.1:[0-9]*' | head -1)"
            [ -n "$ADDR" ] && break
            sleep 1
          done
          [ -n "$ADDR" ] || { echo "backend never started"; cat app.log; exit 1; }
          curl -fsS "http://$ADDR/?app=1" | grep -q "<title>DeckPort</title>"
          echo "Backend up at $ADDR and serving the UI"
          pkill -f "deckport.py serve" || true

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [decky, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "DeckPort $GITHUB_REF_NAME" --generate-notes
