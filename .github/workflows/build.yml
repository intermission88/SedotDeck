name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decky:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: decky-plugin/package-lock.json

      - name: Tests
        run: python3 -I tests/test_sedotdeck.py sedotdeck.py

      - name: Typecheck Decky plugin
        working-directory: decky-plugin
        run: npm ci --no-audit --no-fund && npm run typecheck

      - name: Build Decky plugin
        run: |
          sudo apt-get install -y zip
          decky-plugin/package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: decky
          path: dist/*

  appimage:
    # Older glibc than SteamOS, so the AppImage runs there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build AppImage
        working-directory: desktop
        run: npm ci --no-audit --no-fund && npm run build

      # No version in the name, so the file in ~/Applications and a Steam shortcut to it never change.
      # Repacked with appimagetool to embed update information and write the .zsync next to it,
      # so AppImageUpdate and similar tools can update SedotDeck from the latest GitHub release.
      - name: Collect AppImage with update information
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          sudo apt-get install -y desktop-file-utils
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          built="$(ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage)"
          chmod +x "$built"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$built" --appimage-extract > /dev/null)
          mkdir -p dist
          ./appimagetool --no-appstream \
            -u "gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY##*/}|latest|SedotDeck-x86_64.AppImage.zsync" \
            "$RUNNER_TEMP/squashfs-root" dist/SedotDeck-x86_64.AppImage
          [ -f SedotDeck-x86_64.AppImage.zsync ] && mv SedotDeck-x86_64.AppImage.zsync dist/
          test -f dist/SedotDeck-x86_64.AppImage.zsync
          chmod +x dist/*.AppImage
          ls -la dist

      - name: Smoke test AppImage (CLI mode)
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/SedotDeck-x86_64.AppImage --version

      - name: Smoke test AppImage (window starts its backend)
        run: |
          sudo apt-get install -y xvfb imagemagick
          export APPIMAGE_EXTRACT_AND_RUN=1 HOME="$(mktemp -d)" DISPLAY=:99
          Xvfb :99 -screen 0 1100x760x24 -nolisten tcp &
          sleep 2
          dist/SedotDeck-x86_64.AppImage > app.log 2>&1 &
          for i in $(seq 40); do
            ADDR="$(ss -ltnp | grep '"python3"' | grep -o '127\.0\.0\.1:[0-9]*' | head -1)"
            [ -n "$ADDR" ] && break
            sleep 1
          done
          [ -n "$ADDR" ] || { echo "backend never started"; cat app.log; exit 1; }
          curl -fsS "http://$ADDR/?app=1" | grep -q "<title>SedotDeck</title>"
          echo "Backend up at $ADDR and serving the UI"
          # Screenshot of the real app window (Xvfb has no window manager, so no title bar).
          sleep 6
          mkdir -p shots
          import -window root shots/app-window.png
          pkill -f "sedotdeck.py serve" || true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [decky, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Only the two downloads; the CI screenshots artifact stays out of the release.
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: decky
          path: dist
      # The notes are this version's section of CHANGELOG.md (the annotated tag's message if it has none),
      # then the downloads. Every release, alpha included, is marked Latest.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on && /^\[[^]]+\]: / {exit} on' CHANGELOG.md \
            | sed -e '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message > notes.md || echo "SedotDeck $GITHUB_REF_NAME" > notes.md
          fi
          printf '\n**Downloads**\n- `SedotDeck-x86_64.AppImage` for Desktop Mode\n- `SedotDeck-decky-%s.zip` for Game Mode (install it from Decky'"'"'s Developer settings)\n\nFull history: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$version" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/SedotDeck-x86_64.AppImage dist/SedotDeck-x86_64.AppImage.zsync dist/SedotDeck-decky-*.zip sedotdeck.py \
            --repo "$GITHUB_REPOSITORY" --title "SedotDeck $GITHUB_REF_NAME" --notes-file notes.md --latest
