<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SedotDeck</title>
<style>
/* Shown for the second or so while sedotdeck.py starts; same palette as the main UI. */
:root{--bg:#0f1115;--line:#2b3038;--text:#e6e8eb;--dim:#9aa3ad;--accent:#1a9fff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 "Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:grid;place-items:center}
.boot{display:flex;flex-direction:column;align-items:center;gap:12px}
svg{width:56px;height:56px}
h1{margin:0;font-size:19px}
p{margin:0;color:var(--dim);font-size:13px}
.bar{width:160px;height:4px;border-radius:2px;overflow:hidden;background:var(--line)}
.bar i{display:block;width:40%;height:100%;background:var(--accent);animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
</style></head><body>
<div class="boot">
  <svg viewBox="0 0 256 256" aria-hidden="true">
    <rect x="8" y="8" width="240" height="240" rx="48" fill="#1a1d23" stroke="#3a414c" stroke-width="6"/>
    <path d="M128 52a76 76 0 0 1 70 46M206 70l-6 34-33-10M128 204a76 76 0 0 1-70-46M50 186l6-34 33 10" fill="none" stroke="#1a9fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 92v58M104 128l24 24 24-24" fill="none" stroke="#e6e8eb" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 168h60" stroke="#9aa3ad" stroke-width="12" stroke-linecap="round"/>
  </svg>
  <h1>SedotDeck</h1>
  <div class="bar"><i></i></div>
  <p>Starting SedotDeck…</p>
</div>
</body></html>
