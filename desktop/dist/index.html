<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>DeckPort</title>
<style>
/* Shown for the second or so while deckport.py starts; same palette as the main UI. */
:root{--bg:#050814;--blue-50:#eff6ff;--blue-300:#93c5fd;--blue-400:#60a5fa;--blue-600:#2563eb}
html,body{height:100%;margin:0;background:var(--bg);color:var(--blue-50);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
body{display:grid;place-items:center;
  background:
    radial-gradient(50% 45% at 8% -8%,rgba(37,99,235,.42),transparent 72%),
    radial-gradient(65% 55% at 60% 112%,rgba(30,64,175,.50),transparent 72%),var(--bg)}
.card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 46px;border-radius:24px;
  background:linear-gradient(180deg,rgba(59,130,246,.10),rgba(30,58,138,.04)),rgba(23,37,84,.38);
  border:1px solid rgba(147,197,253,.14);box-shadow:inset 0 1px 0 rgba(239,246,255,.08),0 20px 50px -20px rgba(0,0,0,.8)}
svg{width:64px;height:64px;filter:drop-shadow(0 6px 16px rgba(37,99,235,.5))}
h1{margin:0;font-size:20px}
p{margin:0;color:rgba(147,197,253,.72);font-size:13px}
.bar{width:180px;height:4px;border-radius:99px;overflow:hidden;background:rgba(147,197,253,.12)}
.bar i{display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue-600),var(--blue-400));
  animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
</style></head><body>
<div class="card">
  <svg viewBox="0 0 256 256" aria-hidden="true">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="#172554"/>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#1e40af" stroke-width="6"/>
    <path d="M128 52a76 76 0 0 1 70 46M206 70l-6 34-33-10M128 204a76 76 0 0 1-70-46M50 186l6-34 33 10" fill="none" stroke="#3b82f6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 92v58M104 128l24 24 24-24" fill="none" stroke="#eff6ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 168h60" stroke="#93c5fd" stroke-width="12" stroke-linecap="round"/>
  </svg>
  <h1>DeckPort</h1>
  <div class="bar"><i></i></div>
  <p>Starting DeckPort…</p>
</div>
</body></html>
