[package]
name = "sedotdeck"
version = "0.0.1-alpha"
description = "SedotDeck desktop app: AppImage & PC port updater for Steam Deck"
authors = ["intermission88"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
